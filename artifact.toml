kind = "mobile"
previewPath = "/"
title = "VPN Client App"
version = "1.0.0"
id = "artifacts/vpn-app"
router = "expo-domain"

[[integratedSkills]]
name = "expo"
version = "1.0.0"

[[services]]
ensurePreviewReachable = "/status"
name = "expo"
paths = [ "/" ]
localPort = 21165

[services.development]
run = "pnpm --filter @workspace/vpn-app run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/vpn-app", "run", "build" ]
run = [ "pnpm", "--filter", "@workspace/vpn-app", "run", "serve" ]

[services.env]
PORT = "21165"
BASE_PATH = "/"
